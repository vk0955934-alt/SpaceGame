 box(.12,.15,.75,dk,-.38,1.38,.5,g);box(.06,.06,.4,M(0x777777,.3,.9),-.38,1.4,1.0,g);

const DF=[{f:xeno,hp:2,sp:7,r:1.1,cy:1.2,dmg:8,col:0x9aff6a,pts:10,rng:16,cd:2.6,pc:0x7dff3a,ps:16,pd:7},{f:spider,hp:3,sp:5.5,r:1.3,cy:1.6,dmg:7,col:0xff5555,pts:20,rng:13,cd:2.2,pc:0xff3344,ps:24,pd:9},{f:brute,hp:10,sp:3,r:1.9,cy:2.5,dmg:20,col:0xffaa33,pts:50,rng:20,cd:3.6,pc:0xffa040,ps:13,pd:16},{f:floater,hp:2,sp:4.5,r:1.2,cy:0,dmg:6,col:0xff66ff,pts:30,rng:24,cd:2,pc:0xff66cc,ps:11,pd:6}];
